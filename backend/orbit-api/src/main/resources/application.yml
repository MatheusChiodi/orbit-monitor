# Orbit is local-first: no database of its own, binds to loopback by default.
spring:
  application:
    name: orbit-monitor
  messages:
    basename: messages
    encoding: UTF-8
    # Never follow the OS language: English is the default, pt-BR only when requested.
    fallback-to-system-locale: false

server:
  address: ${ORBIT_BIND_ADDRESS:127.0.0.1}
  port: ${ORBIT_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs

orbit:
  # Configuration files (orbit.<feature>.json) and the vault key; never committed.
  config-dir: ${ORBIT_CONFIG_DIR:${user.home}/.orbit/config}
  master-key: ${ORBIT_MASTER_KEY:${user.home}/.orbit/master.key}
  history: 24h
  workers: 4
  environment: Local
  access:
    mode: LOOPBACK
    lan-acknowledge: true
  http:
    # Private ranges are allowed by default (Orbit watches internal systems); metadata is always blocked.
    block-private: false
    allowlist: []
  wall:
    allowed-origins:
      - "http://localhost:[*]"
      - "http://127.0.0.1:[*]"
