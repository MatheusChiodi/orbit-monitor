# Orbit is local-first: no database of its own, binds to loopback by default.
spring:
  application:
    name: orbit-monitor
  messages:
    basename: messages
    encoding: UTF-8
    # Never follow the OS language: English is the default, pt-BR only when requested.
    fallback-to-system-locale: false

server:
  address: ${ORBIT_BIND_ADDRESS:127.0.0.1}
  port: ${ORBIT_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # metrics: BE-50 self-monitoring (orbit.checks, orbit.queue.size); no personal data in tags.
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs

orbit:
  # Configuration files (orbit.<feature>.json) and the vault key; never committed.
  config-dir: ${ORBIT_CONFIG_DIR:${user.home}/.orbit/config}
  master-key: ${ORBIT_MASTER_KEY:${user.home}/.orbit/master.key}
  # 30-day history and application logs (docs/08); outside the repository.
  data-dir: ${ORBIT_DATA_DIR:${user.home}/.orbit/data}
  history-store:
    retention-days: 30
    max-disk-mb: 1024
    min-free-disk-mb: 512
  history: 24h
  workers: 4
  environment: Local
  # Base of the links in notifications (set to the LAN address when the TV and phones should open them).
  public-url: ${ORBIT_PUBLIC_URL:http://127.0.0.1:8080}
  access:
    mode: LOOPBACK
    lan-acknowledge: true
  http:
    # Private ranges are allowed by default (Orbit watches internal systems); metadata is always blocked.
    block-private: false
    allowlist: []
  # BE-47: per client IP token bucket on /api/** and the push endpoint; loopback (the console) is exempt.
  rate-limit:
    requests-per-minute: 300
    burst: 60
    exempt-loopback: true
  # BE-50: encrypted config backups in ~/.orbit/backups, newest 7 kept, one a day.
  backup:
    keep: 7
    interval: PT24H
  wall:
    allowed-origins:
      - "http://localhost:[*]"
      - "http://127.0.0.1:[*]"
