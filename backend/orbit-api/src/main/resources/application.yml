# Orbit is local-first: no database of its own, binds to loopback by default.
spring:
  application:
    name: orbit-monitor

server:
  address: ${ORBIT_BIND_ADDRESS:127.0.0.1}
  port: ${ORBIT_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
