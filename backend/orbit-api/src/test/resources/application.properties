# Tests never touch ~/.orbit: config and master key live in a throwaway directory.
orbit.config-dir=${java.io.tmpdir}/orbit-test/${random.uuid}/config
orbit.master-key=${java.io.tmpdir}/orbit-test/${random.uuid}/master.key
orbit.data-dir=${java.io.tmpdir}/orbit-test/${random.uuid}/data
orbit.history-store.min-free-disk-mb=0
