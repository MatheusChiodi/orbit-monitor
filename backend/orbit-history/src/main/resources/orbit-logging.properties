# Application log (BE-53, docs/08 section 5). Imported by the app with spring.config.import.
# Daily files rolled at 50 MB, gzip, kept 30 days and capped at 512 MB in total; masked JSON lines.
logging.file.name=${orbit.data-dir:${user.home}/.orbit/data}/logs/orbit.log
logging.structured.format.file=io.orbit.history.applog.MaskedJsonFormatter
logging.logback.rollingpolicy.file-name-pattern=${orbit.data-dir:${user.home}/.orbit/data}/logs/orbit-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=512MB
logging.logback.rollingpolicy.clean-history-on-start=true
