<text x="522" y="232" class="mono" text-anchor="start" xml:space="preserve" fill="#5a6575" >edit monitors</text>
<text x="688" y="232" class="mono-s" text-anchor="end" xml:space="preserve" >no</text>
<rect x="716" y="80" width="220" height="200" rx="8" fill="#0d1117" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
<rect x="732" y="96" width="36" height="24" rx="3" fill="none" stroke="#8b96a6"/>
<line x1="742" y1="126" x2="758" y2="126" stroke="#8b96a6"/>
<text x="780" y="108" class="name" text-anchor="start" xml:space="preserve" style="font-size:13px">Internet</text>
<text x="780" y="124" class="mono-s" text-anchor="start" xml:space="preserve" >not exposed</text>
<circle cx="740" cy="164" r="5" fill="#ff3b4f" fill-opacity="0.85"/>
<text x="754" y="168" class="mono" text-anchor="start" xml:space="preserve" fill="#5a6575" >view</text>
<text x="920" y="168" class="mono-s" text-anchor="end" xml:space="preserve" >no</text>
<circle cx="740" cy="196" r="5" fill="#ff3b4f" fill-opacity="0.85"/>
<text x="754" y="200" class="mono" text-anchor="start" xml:space="preserve" fill="#5a6575" >acknowledge</text>
<text x="920" y="200" class="mono-s" text-anchor="end" xml:space="preserve" >no</text>
<circle cx="740" cy="228" r="5" fill="#ff3b4f" fill-opacity="0.85"/>
<text x="754" y="232" class="mono" text-anchor="start" xml:space="preserve" fill="#5a6575" >edit monitors</text>
