<text x="680" y="232" class="mono" text-anchor="start" xml:space="preserve" fill="#ffb3ba" >347</text>
<circle cx="806" cy="228" r="4" fill="#ff3b4f"/>
<text x="818" y="232" class="mono-s" text-anchor="start" xml:space="preserve" fill="#ffb3ba" >fails now</text>
<text x="40" y="262" class="mono" text-anchor="start" xml:space="preserve" >[COL].LAST_BATCH_AT</text>
<text x="300" y="262" class="mono" text-anchor="start" xml:space="preserve" fill="#8b96a6" >newer than</text>
<text x="440" y="262" class="mono" text-anchor="start" xml:space="preserve" >60min</text>
<rect x="560" y="248" width="42" height="19" rx="3" fill="#f5a524" fill-opacity="0.14" stroke="#f5a524" stroke-opacity="0.6"/>
<text x="567" y="262" class="lab" text-anchor="start" xml:space="preserve" fill="#eef2f7" >WARN</text>
<text x="680" y="262" class="mono" text-anchor="start" xml:space="preserve" fill="#eef2f7" >12min</text>
<circle cx="806" cy="258" r="4" fill="#22c55e"/>
<text x="818" y="262" class="mono-s" text-anchor="start" xml:space="preserve" fill="#8b96a6" >passes</text>
