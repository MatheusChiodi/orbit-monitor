<text x="680" y="172" class="mono" text-anchor="start" xml:space="preserve" fill="#eef2f7" >184ms</text>
<circle cx="806" cy="168" r="4" fill="#22c55e"/>
<text x="818" y="172" class="mono-s" text-anchor="start" xml:space="preserve" fill="#8b96a6" >passes</text>
<text x="40" y="202" class="mono" text-anchor="start" xml:space="preserve" >[BODY].status</text>
<text x="300" y="202" class="mono" text-anchor="start" xml:space="preserve" fill="#8b96a6" >==</text>
<text x="440" y="202" class="mono" text-anchor="start" xml:space="preserve" >&quot;UP&quot;</text>
<rect x="560" y="188" width="42" height="19" rx="3" fill="#ff3b4f" fill-opacity="0.14" stroke="#ff3b4f" stroke-opacity="0.6"/>
<text x="567" y="202" class="lab" text-anchor="start" xml:space="preserve" fill="#eef2f7" >DOWN</text>
<text x="680" y="202" class="mono" text-anchor="start" xml:space="preserve" fill="#eef2f7" >&quot;UP&quot;</text>
<circle cx="806" cy="198" r="4" fill="#22c55e"/>
<text x="818" y="202" class="mono-s" text-anchor="start" xml:space="preserve" fill="#8b96a6" >passes</text>
<rect x="21" y="212" width="918" height="28" fill="#ff3b4f" fill-opacity="0.10"/>
<rect x="21" y="212" width="4" height="28" fill="#ff3b4f" class="pulse"/>
