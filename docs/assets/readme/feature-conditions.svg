<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="feature-conditions-title feature-conditions-desc">
<title id="feature-conditions-title">Gatus-style health conditions</title>
<desc id="feature-conditions-desc">A table of conditions with field, operator, value and level, validated live against the preview; one condition fails right now.</desc>
<defs>
  <marker id="feature-conditions-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8b96a6"/></marker>
  <marker id="feature-conditions-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3b9eff"/></marker>
</defs>
<style>
  .name { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #eef2f7; }
  .name-l { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #eef2f7; }
  .name-xl { font: 800 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #eef2f7; }
  .body { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #8b96a6; }
  .sub { font: 400 11px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #8b96a6; }
  .mono { font: 400 12px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #eef2f7; }
  .mono-s { font: 400 10px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #8b96a6; }
  .eye { font: 600 10px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #5a6575; letter-spacing: 0.12em; }
  .lab { font: 600 10px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #8b96a6; letter-spacing: 0.06em; }
  .num { font: 700 26px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #eef2f7; }
  .num-s { font: 600 15px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #eef2f7; }
  .flow { fill: none; stroke: #3b9eff; stroke-width: 2.2; stroke-linecap: round;
          stroke-dasharray: 3 17; animation: orbit-flow 1.4s linear infinite; }
  .pulse { animation: orbit-pulse 1.4s ease-in-out infinite; }
  @keyframes orbit-flow { to { stroke-dashoffset: -40; } }
  @keyframes orbit-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .anim-only { display: none; }
    * { animation: none !important; }
  }
</style>
<rect width="960" height="330" rx="12" fill="#07090d"/>
<text x="20" y="34" class="eye" text-anchor="start" xml:space="preserve" >CONDITIONS · FIELD · OPERATOR · VALUE · LEVEL</text>
<text x="20" y="58" class="body" text-anchor="start" xml:space="preserve" style="font-size:13px">Short expressions evaluated against every result, with a warning and a down level. No scripting engine.</text>
<rect x="20" y="76" width="920" height="236" rx="8" fill="#0d1117" stroke="rgba(255,255,255,0.13)" />
<text x="40" y="102" class="eye" text-anchor="start" xml:space="preserve" >FIELD</text>
<text x="300" y="102" class="eye" text-anchor="start" xml:space="preserve" >OPERATOR</text>
<text x="440" y="102" class="eye" text-anchor="start" xml:space="preserve" >VALUE</text>
<text x="560" y="102" class="eye" text-anchor="start" xml:space="preserve" >LEVEL</text>
<text x="680" y="102" class="eye" text-anchor="start" xml:space="preserve" >NOW</text>
<text x="800" y="102" class="eye" text-anchor="start" xml:space="preserve" >RESULT</text>
<line x1="20" y1="114" x2="940" y2="114" stroke="rgba(255,255,255,0.13)"/>
