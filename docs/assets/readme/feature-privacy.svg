<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="feature-privacy-title feature-privacy-desc">
<title id="feature-privacy-title">Privacy by design: sensitive values are masked</title>
<desc id="feature-privacy-desc">Card number, CVV, CPF, e-mail and token fields pass through a redactor at the probe boundary and come out masked; a full card number is never shown.</desc>
<defs>
  <marker id="feature-privacy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8b96a6"/></marker>
  <marker id="feature-privacy-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3b9eff"/></marker>
</defs>
<style>
  .name { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #eef2f7; }
  .name-l { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #eef2f7; }
  .name-xl { font: 800 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #eef2f7; }
  .body { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #8b96a6; }
  .sub { font: 400 11px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #8b96a6; }
  .mono { font: 400 12px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #eef2f7; }
  .mono-s { font: 400 10px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #8b96a6; }
  .eye { font: 600 10px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #5a6575; letter-spacing: 0.12em; }
  .lab { font: 600 10px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #8b96a6; letter-spacing: 0.06em; }
  .num { font: 700 26px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #eef2f7; }
  .num-s { font: 600 15px ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; fill: #eef2f7; }
  .flow { fill: none; stroke: #3b9eff; stroke-width: 2.2; stroke-linecap: round;
          stroke-dasharray: 3 17; animation: orbit-flow 1.4s linear infinite; }
  .pulse { animation: orbit-pulse 1.4s ease-in-out infinite; }
  @keyframes orbit-flow { to { stroke-dashoffset: -40; } }
  @keyframes orbit-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .anim-only { display: none; }
    * { animation: none !important; }
  }
</style>
<rect width="960" height="330" rx="12" fill="#07090d"/>
<text x="20" y="34" class="eye" text-anchor="start" xml:space="preserve" >PRIVACY BY DESIGN · LGPD &amp; PCI DSS</text>
<text x="20" y="58" class="body" text-anchor="start" xml:space="preserve" style="font-size:13px">Sensitive values are detected by value (Luhn, check digits) and by field name, and masked before anything leaves the probe.</text>
<rect x="20" y="76" width="280" height="236" rx="8" fill="#0d1117" stroke="rgba(255,255,255,0.13)" /><text x="36" y="100" class="eye" text-anchor="start" xml:space="preserve" >PROBE RESULT · MEMORY ONLY</text>
<text x="36" y="128" class="mono" text-anchor="start" xml:space="preserve" >card_number</text>
<rect x="150" y="116" width="120" height="14" rx="3" fill="#8b96a6" fill-opacity="0.35"/>
<text x="36" y="166" class="mono" text-anchor="start" xml:space="preserve" >cvv</text>
<rect x="150" y="154" width="40" height="14" rx="3" fill="#8b96a6" fill-opacity="0.35"/>
<text x="36" y="204" class="mono" text-anchor="start" xml:space="preserve" >cpf</text>
<rect x="150" y="192" width="96" height="14" rx="3" fill="#8b96a6" fill-opacity="0.35"/>
<text x="36" y="242" class="mono" text-anchor="start" xml:space="preserve" >email</text>
<rect x="150" y="230" width="110" height="14" rx="3" fill="#8b96a6" fill-opacity="0.35"/>
<text x="36" y="280" class="mono" text-anchor="start" xml:space="preserve" >api_token</text>
<rect x="150" y="268" width="80" height="14" rx="3" fill="#8b96a6" fill-opacity="0.35"/>
<path d="M300,194 H352" fill="none" stroke="#3b9eff" stroke-opacity="1" stroke-width="1.4" marker-end="url(#feature-privacy-arrow-accent)"/>
<rect x="356" y="148" width="168" height="92" rx="6" fill="#07090d"/>
<rect x="356" y="148" width="168" height="92" rx="6" fill="#121820" stroke="#3b9eff" stroke-width="1.5"/>
<rect x="368" y="158" width="97" height="15" rx="2" fill="none" stroke="#3b9eff"/>
<text x="373" y="169" class="lab" text-anchor="start" xml:space="preserve" fill="#3b9eff" >PROBE BOUNDARY</text>
<text x="368" y="192" class="name" text-anchor="start" xml:space="preserve" >Redactor</text>
<text x="368" y="210" class="sub" text-anchor="start" xml:space="preserve" >detect · classify</text>
<text x="368" y="225" class="sub" text-anchor="start" xml:space="preserve" >mask · drop</text>
<path d="M524,194 H576" fill="none" stroke="#8b96a6" stroke-opacity="0.75" stroke-width="1.4" marker-end="url(#feature-privacy-arrow)"/>
<rect x="580" y="76" width="360" height="236" rx="8" fill="#0d1117" stroke="rgba(255,255,255,0.13)" /><text x="596" y="100" class="eye" text-anchor="start" xml:space="preserve" >API · WEBSOCKET · LOGS · WALL</text>
<text x="596" y="128" class="mono" text-anchor="start" xml:space="preserve" fill="#eef2f7" >•••• •••• •••• 1111</text>
<rect x="837" y="115" width="87" height="18" rx="3" fill="#ff3b4f" fill-opacity="0.14" stroke="#ff3b4f" stroke-opacity="0.6"/>
<text x="917" y="128" class="mono-s" text-anchor="end" xml:space="preserve" fill="#eef2f7" >PCI · masked</text>
<text x="596" y="166" class="mono" text-anchor="start" xml:space="preserve" fill="#eef2f7" >[REDACTED]</text>
<rect x="806" y="153" width="118" height="18" rx="3" fill="#ff3b4f" fill-opacity="0.14" stroke="#ff3b4f" stroke-opacity="0.6"/>
<text x="917" y="166" class="mono-s" text-anchor="end" xml:space="preserve" fill="#eef2f7" >PCI · never shown</text>
<text x="596" y="204" class="mono" text-anchor="start" xml:space="preserve" fill="#eef2f7" >•••.•••.•••-12</text>
<rect x="818" y="191" width="106" height="18" rx="3" fill="#f5a524" fill-opacity="0.14" stroke="#f5a524" stroke-opacity="0.6"/>
<text x="917" y="204" class="mono-s" text-anchor="end" xml:space="preserve" fill="#eef2f7" >LGPD · personal</text>
<text x="596" y="242" class="mono" text-anchor="start" xml:space="preserve" fill="#eef2f7" >j•••@d•••.com</text>
<rect x="818" y="229" width="106" height="18" rx="3" fill="#f5a524" fill-opacity="0.14" stroke="#f5a524" stroke-opacity="0.6"/>
<text x="917" y="242" class="mono-s" text-anchor="end" xml:space="preserve" fill="#eef2f7" >LGPD · personal</text>
<text x="596" y="280" class="mono" text-anchor="start" xml:space="preserve" fill="#eef2f7" >••••</text>
<rect x="873" y="267" width="51" height="18" rx="3" fill="#8b96a6" fill-opacity="0.14" stroke="#8b96a6" stroke-opacity="0.6"/>
<text x="917" y="280" class="mono-s" text-anchor="end" xml:space="preserve" fill="#eef2f7" >secret</text>
</svg>
