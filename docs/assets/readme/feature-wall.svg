<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="feature-wall-title feature-wall-desc">
<title id="feature-wall-title">The wall in TV mode</title>
<desc id="feature-wall-desc">Mock of the Orbit wall: global status header, hero incident with threshold chart and acknowledge button, also active, near threshold, monitor matrix and timeline.</desc>
